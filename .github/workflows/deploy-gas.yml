name: Deploy GAS Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Code.gs'
      - 'Index.html'
      - 'appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLASP_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @google/clasp
      - name: Setup clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          echo "$CLASP_CREDENTIALS" > ~/.clasprc.json
          echo "clasp config ready"
      - name: Push and deploy to Apps Script
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          echo "clasp.json content:"
          cat .clasp.json
          echo ""
          clasp push --force
          # Keep existing deployment stable - don't create new deployment automatically
          # clasp version "Deploy $GITHUB_SHA" || echo "version creation skipped"
          clasp deployments || echo "list deployments failed"
