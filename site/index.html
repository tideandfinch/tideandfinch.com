<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dceff0">
  <meta name="description" content="A fresh perspective on everyday refreshment.">
  <link rel="icon" href="data:,">
  <title>Tide and Finch</title>
  <style>
    :root {
      color-scheme: light;
      --sky: #dceff0;
      --ink: #0b2530;
      --sea: #176d78;
      --sun: #f5b553;
      --coral: #df6d4f;
      --foam: #f8fbf8;
      --light: #75bac0;
      --line: rgba(11, 37, 48, .22);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--sky);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-synthesis: none;
    }

    button, input { font: inherit; }

    .page {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, .96fr) minmax(390px, 1.04fr);
      grid-template-rows: 1fr auto;
      column-gap: clamp(2rem, 5vw, 6.5rem);
      padding: max(2.4rem, env(safe-area-inset-top)) clamp(1.35rem, 5.5vw, 6.5rem) max(1.4rem, env(safe-area-inset-bottom));
    }

    .copy {
      position: relative;
      z-index: 3;
      min-width: 0;
      align-self: center;
      padding: 1rem 0 3.2rem;
    }

    .hero {
      width: max-content;
      max-width: 100%;
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(4.25rem, 8.45vw, 8.45rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .8;
    }

    .hero span { display: block; white-space: nowrap; }
    .hero .tide {
      margin-left: .72em;
      color: var(--sea);
      font-style: italic;
      letter-spacing: -.045em;
    }

    .intro {
      max-width: 28rem;
      margin: clamp(1.7rem, 3vw, 2.5rem) 0 0;
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(1.1rem, 1.55vw, 1.35rem);
      line-height: 1.42;
    }

    .signup {
      width: min(100%, 31rem);
      margin-top: clamp(2rem, 4vw, 3.25rem);
    }

    .signup-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: .62rem;
    }

    .signup input,
    .signup button {
      height: 3.5rem;
      border-radius: 999px;
    }

    .signup input {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(11, 37, 48, .36);
      padding: 0 1.3rem;
      outline: none;
      background: rgba(248, 251, 248, .72);
      color: var(--ink);
    }

    .signup input::placeholder { color: rgba(11, 37, 48, .65); }
    .signup input:focus {
      border-color: var(--sea);
      box-shadow: 0 0 0 3px rgba(23, 109, 120, .14);
    }

    .signup button {
      min-width: 9.8rem;
      border: 0;
      padding: 0 1.55rem;
      background: var(--ink);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .signup button:hover { background: var(--sea); }
    .signup button:active { transform: translateY(1px); }
    .signup button:disabled { opacity: .68; cursor: wait; }

    .status {
      min-height: 1.35rem;
      margin: .75rem 0 0;
      font-size: .88rem;
      line-height: 1.45;
    }
    .status[data-state="success"] { color: var(--sea); }
    .status[data-state="error"] { color: #8b3826; }

    .art {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 32rem;
      align-self: stretch;
      overflow: hidden;
    }
    .art svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .disc { fill: var(--sun); }
    .bird { fill: var(--ink); }
    .bird-detail { fill: none; stroke: var(--foam); stroke-width: 2.4; stroke-linecap: round; opacity: .82; }
    .light { fill: var(--light); }
    .foam { fill: var(--foam); }
    .deep { fill: var(--sea); }
    .coral { fill: var(--coral); }

    footer {
      position: relative;
      z-index: 4;
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--line);
      color: rgba(11, 37, 48, .76);
      font-size: .74rem;
      letter-spacing: .055em;
    }
    footer span:first-child { font-weight: 600; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 960px) {
      .page {
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        padding: max(1.7rem, env(safe-area-inset-top)) 1.25rem max(1.1rem, env(safe-area-inset-bottom));
      }
      .copy { align-self: stretch; text-align: center; padding: clamp(1.4rem, 6vh, 3.5rem) 0 .5rem; }
      .hero { margin-inline: auto; font-size: clamp(3.85rem, 16vw, 6.4rem); line-height: .82; }
      .intro { margin-inline: auto; }
      .signup { width: min(100%, 27rem); margin: 1.8rem auto 0; }
      .status { text-align: center; }
      .art {
        width: min(100%, 39rem);
        min-height: 18rem;
        height: min(44vh, 28rem);
        margin: 0 auto;
        flex: 1 0 18rem;
      }
      footer { margin-top: .45rem; }
    }

    @media (max-width: 530px) {
      .page { padding-inline: 1rem; }
      .copy { padding-top: .8rem; }
      .hero { font-size: clamp(3.3rem, 18vw, 5.25rem); }
      .hero .tide { margin-left: .56em; }
      .intro { max-width: 21rem; font-size: 1rem; }
      .signup-row { grid-template-columns: 1fr; justify-items: center; }
      .signup input { width: 100%; }
      .signup button { width: auto; min-width: 10.8rem; }
      .art { min-height: 15rem; flex-basis: 15rem; }
      footer { font-size: .69rem; }
    }

    @media (max-height: 700px) and (min-width: 961px) {
      .page { padding-block: 1.4rem 1rem; }
      .copy { padding-bottom: 1.2rem; }
      .hero { font-size: clamp(4rem, 7.8vw, 6.8rem); }
      .intro { margin-top: 1.35rem; }
      .signup { margin-top: 1.5rem; }
      .art { min-height: 26rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="copy" aria-labelledby="hero-heading">
      <h1 class="hero" id="hero-heading">
        <span>Come ride</span>
        <span class="tide">the tide.</span>
      </h1>
      <p class="intro">A fresh perspective on everyday refreshment.</p>

      <form class="signup" id="signup" novalidate>
        <div class="signup-row">
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Enter your email" aria-label="Email address" required maxlength="254">
          <button type="submit">Stay in touch</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <figure class="art" aria-label="A finch gliding above an abstract ocean tide">
      <svg viewBox="0 0 900 720" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
        <circle class="disc" cx="598" cy="190" r="139"/>
        <g class="bird" transform="translate(432 128) rotate(-7)">
          <path d="M23 105c42-3 61-39 94-52 18-7 42-3 61 9 25 15 39 5 51-18-1 29-12 51-31 65-16 12-35 17-56 15-19 20-48 29-78 22 16-6 27-17 31-33-28 8-50 6-72-8Z"/>
          <path d="M118 55c-3-20 8-38 28-49-2 17 4 29 20 38-18-3-34 1-48 11Z"/>
          <path d="M228 44l35 4-32 14Z"/>
          <circle cx="205" cy="55" r="4.5" fill="#f8fbf8"/>
          <path class="bird-detail" d="M75 108c31 4 64-5 94-31M96 119c25 0 47-7 67-21"/>
        </g>
        <path class="light" d="M-30 456C97 395 210 397 333 450c91 40 176 57 276 18 100-39 198-36 321 31v245H-30Z"/>
        <path class="foam" d="M-44 503c109-53 219-47 321 1 113 53 221 63 322 9 109-58 221-50 346 12l-4 72c-120-52-221-57-318-9-114 55-233 46-354-11-98-46-203-48-313 4Z"/>
        <path class="deep" d="M-37 574c117-42 218-35 317 8 125 54 242 55 351-4 91-49 190-50 307 0v177H-37Z"/>
        <path class="coral" d="M-49 652c95-32 190-30 286 8 131 52 253 49 365-4 105-50 215-48 338 7v101H-49Z"/>
        <path class="foam" d="M-40 696c88-28 184-24 289 13 126 45 245 42 355-2 101-40 209-39 331 8v57H-40Z"/>
      </svg>
    </figure>

    <footer><span>tideandfinch.com</span><span>© 2026</span></footer>
  </main>

  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxzgH_o5q4sAYjQM4RitutMGNj9IpIhBgKwZsDOMWVgxWfe_KS4N23-jUxbNXlPw87roA/exec';
    const form = document.getElementById('signup');
    const email = document.getElementById('email');
    const button = form.querySelector('button');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';
      status.dataset.state = '';

      if (!email.checkValidity()) {
        status.textContent = 'Please enter a valid email address.';
        status.dataset.state = 'error';
        email.focus();
        return;
      }

      button.disabled = true;
      button.textContent = 'Adding you…';
      const body = new URLSearchParams({ email: email.value.trim() });

      try {
        // Apps Script web apps do not reliably expose CORS response headers.
        // An opaque response still confirms the browser completed the POST.
        await fetch(ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body
        });
        form.reset();
        status.textContent = "You're on the list — we'll be in touch.";
        status.dataset.state = 'success';
      } catch (error) {
        status.textContent = 'Something went wrong. Please try again.';
        status.dataset.state = 'error';
      } finally {
        button.disabled = false;
        button.textContent = 'Stay in touch';
      }
    });
  </script>
</body>
</html>
